spring:
  application:
    name: financeiro
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          response-format:
            type: TEXT
      audio:
        transcription:
          options:
            model: whisper-1
            language: pt
            temperature: 0
            response-format: text
            prompt: >
              Áudio em português brasileiro.
              Áudio contém descrição de gastos financeiros.
              As frases geralmente contem:
               - um valor em reais (número + "reais");
               - uma ação (gastei, paguei, comprei);
               - um local ou estabelecimento (mercado, farmácia, restaurante, loja, etc.).
        speech:
          options:
            model: gpt-4o-mini-tts
            voice: nova
            speed: 1.2
            response-format: mp3
    model:
      audio:
        transcription: openai
        speech: openai

logging:
  level:
    org.springframework.ai: DEBUG